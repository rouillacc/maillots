4<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1b3fa6">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<style>
  :root {
    --cobalt: #1b3fa6;
    --cobalt-deep: #12296e;
    --cobalt-soft: #dbe7ff;
    --sun: #ffc61a;
    --sun-deep: #e6ab00;
    --sky: #eef3fb;
    --paper: #ffffff;
    --ink: #14213d;
    --muted: #5b6b8c;
    --line: #d9e2f2;
    --mint: #1f9d63;
    --mint-bg: #e3f6ec;
    --mint-line: #b4e3cb;
    --coral: #d64550;
    --coral-bg: #fdebec;

    --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
    --body: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    font-family: var(--body);
    color: var(--ink);
    background: var(--sky);
    padding-bottom: calc(40px + env(safe-area-inset-bottom, 0px));
  }

  button { font-family: inherit; }
  button:focus-visible, input:focus-visible {
    outline: 3px solid var(--sun);
    outline-offset: 2px;
  }

  .wrap { max-width: 720px; margin: 0 auto; }

  header.hero {
    background:
      repeating-linear-gradient(115deg, rgba(255,255,255,.055) 0 18px, transparent 18px 36px),
      linear-gradient(180deg, var(--cobalt) 0%, var(--cobalt-deep) 100%);
    color: #fff;
    padding: calc(20px + env(safe-area-inset-top, 0px)) 18px 22px;
    border-radius: 0 0 28px 28px;
    position: relative;
  }
  .hero-inner { max-width: 720px; margin: 0 auto; }

  .club {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: .88rem;
    color: #c8d6ff;
    font-weight: 500;
  }
  .club-badge {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--sun);
    color: var(--cobalt-deep);
    display: grid; place-items: center;
    font-family: var(--display);
    font-weight: 800;
    font-size: 1.05rem;
    letter-spacing: .5px;
    flex: none;
  }

  .cloud-badge {
    margin-left: auto;
    font-size: 0.78rem;
    font-weight: 700;
    padding: 5px 12px;
    border-radius: 20px;
    background: rgba(0,0,0,0.25);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .cloud-dot { width: 8px; height: 8px; border-radius: 50%; background: #ffaa00; }
  .cloud-dot.online { background: #34d399; box-shadow: 0 0 8px #34d399; }
  .cloud-dot.err { background: var(--coral); }

  h1 {
    font-family: var(--display);
    font-weight: 800;
    font-size: clamp(2.4rem, 11vw, 3.4rem);
    line-height: .95;
    margin: 12px 0 0;
    letter-spacing: .3px;
  }

  .score {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-top: 18px;
  }
  .score-num {
    font-family: var(--display);
    font-weight: 800;
    font-size: 3.6rem;
    line-height: 1;
    color: var(--sun);
  }
  .score-total {
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.8rem;
    color: #fff;
    opacity: .85;
  }
  .score-label { font-size: .92rem; color: #c8d6ff; margin-left: auto; text-align: right; }

  .bar {
    height: 10px;
    border-radius: 99px;
    background: rgba(255,255,255,.18);
    overflow: hidden;
    margin-top: 10px;
  }
  .bar-fill {
    height: 100%;
    width: 0;
    background: var(--sun);
    border-radius: 99px;
    transition: width .7s cubic-bezier(.2,.8,.2,1);
  }

  .actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
    flex-wrap: wrap;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    border: none;
    border-radius: 12px;
    padding: 12px 16px;
    font-weight: 700;
    font-size: .95rem;
    cursor: pointer;
    min-height: 44px;
    transition: transform .12s ease, background .12s ease;
  }
  .btn:active { transform: scale(.97); }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn-sun { background: var(--sun); color: var(--cobalt-deep); }
  .btn-sun:hover { background: #ffd23f; }
  .btn-ghost { background: rgba(255,255,255,.14); color: #fff; }
  .btn-ghost:hover { background: rgba(255,255,255,.22); }
  .btn-clear { margin-left: auto; background: transparent; color: #ffb3b8; padding-inline: 10px; }
  .btn-clear:hover { color: #fff; }

  #csv-file { display: none; }

  .toolbar {
    position: sticky;
    top: 0;
    z-index: 5;
    padding: 14px 14px 10px;
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    background: linear-gradient(180deg, var(--sky) 78%, rgba(238,243,251,0));
  }
  .search { position: relative; }
  .search svg {
    position: absolute; left: 14px; top: 50%;
    width: 20px; height: 20px;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
  }
  #search {
    width: 100%;
    padding: 14px 14px 14px 44px;
    border: 2px solid var(--line);
    border-radius: 14px;
    font-family: var(--body);
    font-size: 1rem;
    background: var(--paper);
    color: var(--ink);
  }
  #search:focus { border-color: var(--cobalt); outline: none; }

  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px;
    background: #dfe8f7;
    padding: 4px;
    border-radius: 14px;
    margin-top: 10px;
  }
  .tab {
    border: none;
    background: transparent;
    padding: 10px 8px;
    border-radius: 11px;
    font-weight: 700;
    font-size: .95rem;
    color: var(--muted);

  .tab .count {
    font-family: var(--display);
    font-size: 1.15rem;
    font-weight: 800;
    min-width: 28px;
    padding: 0 8px;
    border-radius: 99px;

  .tab[aria-selected="true"] {
    background: var(--paper);
    color: var(--ink);
    box-shadow: 0 1px 3px rgba(20,33,61,.12);

  .tab[aria-selected="true"] .count { background: var(--cobalt); color: #fff; }
  .tab[data-tab="done"][aria-selected="true"] .count { background: var(--mint); }

  .list { padding: 4px 14px 0; display: grid; gap: 10px; }

  .student {
    background: var(--paper);
    border: 1.5px solid var(--line);
    border-radius: 16px;
    padding: 12px;
  }
  .student.done {
    background: var(--mint-bg);
    border-color: var(--mint-line);
  }
  .student.just-done { animation: pop .45s ease; }
  @keyframes pop {
    0% { transform: scale(.97); }
    60% { transform: scale(1.015); }
    100% { transform: scale(1); }
  }

  .student-head { display: flex; align-items: center; gap: 12px; }
  .avatar {
    width: 44px; height: 44px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-family: var(--display);
    font-weight: 800;
    font-size: 1.2rem;
    letter-spacing: .5px;
    flex: none;
    background: var(--cobalt-soft);
    color: var(--cobalt);
  }
  .lvl-6 { background: #dbe7ff; color: #1b3fa6; }
  .lvl-5 { background: #ffeeb8; color: #7a5200; }
  .lvl-4 { background: #d3f3e2; color: #136b43; }
  .lvl-3 { background: #ffdadd; color: #9c2530; }

  .student-info { min-width: 0; flex: 1; }
  .student-name {
    font-weight: 700;
    font-size: 1.05rem;
    line-height: 1.2;
    overflow-wrap: anywhere;
  }
  .student-name b { font-weight: 800; }
  .student-sub { font-size: .85rem; color: var(--muted); margin-top: 2px; }

  .sizes {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 6px;
    margin-top: 12px;
  }
  .btn-size {
    border: 2px solid var(--cobalt);
    background: #fff;
    color: var(--cobalt);
    border-radius: 10px;
    padding: 0;
    height: 46px;
    font-family: var(--display);
    font-weight: 700;
    font-size: 1.15rem;
    cursor: pointer;
    transition: background .12s ease, color .12s ease, transform .12s ease;
  }
  .btn-size.small { font-size: .95rem; }
  .btn-size:hover { background: var(--cobalt-soft); }
  .btn-size:active { background: var(--cobalt); color: #fff; transform: scale(.94); }

  .done-side { display: flex; align-items: center; gap: 8px; flex: none; }
  .size-tag {
    font-family: var(--display);
    font-weight: 800;
    font-size: 1.35rem;
    line-height: 1;
    color: #fff;
    background: var(--mint);
    padding: 8px 12px;
    border-radius: 10px;
    min-width: 46px;
    text-align: center;
  }
  .btn-cancel {
    border: 1.5px solid #f2b8bc;
    background: #fff;
    color: var(--coral);
    border-radius: 10px;
    padding: 0 12px;
    height: 40px;
    font-weight: 700;
    font-size: .85rem;
    cursor: pointer;
  }
  .btn-cancel:active { background: var(--coral-bg); }

  .empty {
    text-align: center;
    padding: 36px 20px;
    color: var(--muted);
  }
  .empty-icon {
    width: 64px; height: 64px;
    margin: 0 auto 12px;
    border-radius: 50%;
    background: var(--cobalt-soft);
    color: var(--cobalt);
    display: grid; place-items: center;
  }
  .empty-icon svg { width: 30px; height: 30px; }
  .empty h2 {
    font-family: var(--display);
    font-size: 1.6rem;
    font-weight: 800;
    color: var(--ink);
    margin: 0 0 4px;
  }
  .empty p { margin: 0 auto 16px; max-width: 32ch; line-height: 1.45; }
  .empty .btn-primary { background: var(--cobalt); color: #fff; }

  #notif {
    position: fixed;
    left: 50%;
    bottom: calc(20px + env(safe-area-inset-bottom, 0px));
    transform: translate(-50%, 24px);
    opacity: 0;
    pointer-events: none;
    max-width: min(92vw, 520px);
    padding: 13px 18px;
    border-radius: 14px;
    font-weight: 700;
    font-size: .92rem;
    box-shadow: 0 8px 24px rgba(20,33,61,.25);
    transition: opacity .2s ease, transform .2s ease;
    z-index: 20;
  }
  #notif.show { opacity: 1; transform: translate(-50%, 0); }
  #notif.ok { background: var(--ink); color: #fff; }
  #notif.err { background: var(--coral); color: #fff; }
</style>
</head>
<body>

<header class="hero">
  <div class="hero-inner">
    <div class="club">
      <span class="club-badge">AS</span>
      <span>AS Claudie Haigneré · Rouillac</span>
      <span class="cloud-badge" id="cloud-status">
        <span class="cloud-dot" id="cloud-dot"></span>
        <span id="cloud-text">Connexion...</span>
      </span>
    </div>
    <h1>Distribution<br>des T-shirts</h1>

    <div class="score" aria-live="polite">
      <span class="score-num" id="count-distribues">0</span>
      <span class="score-total">/ <span id="count-total">0</span></span>
      <span class="score-label">T-shirts<br>distribués</span>
    </div>
    <div class="bar" role="progressbar" aria-label="Avancement de la distribution" aria-valuemin="0" aria-valuemax="100" id="bar">
      <div class="bar-fill" id="bar-fill"></div>
    </div>

    <div class="actions">
      <button type="button" class="btn btn-sun" onclick="document.getElementById('csv-file').click()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 20h16"/></svg>
        Importer un CSV
      </button>
      <input type="file" id="csv-file" accept=".csv,text/csv,text/plain" onchange="lireFichierCSV(event)">

      <button type="button" class="btn btn-ghost" onclick="exporterCSV()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M4 20h16"/></svg>
        Exporter
      </button>

      <button type="button" class="btn btn-clear" onclick="reinitialiserTout()">Vider la liste</button>
    </div>
  </div>
</header>

<main class="wrap">
  <div class="toolbar">
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="text" id="search" placeholder="Nom, prénom ou niveau" autocomplete="off" oninput="rendre()" aria-label="Rechercher un élève">
    </label>
    <div class="tabs" role="tablist">
      <button type="button" class="tab" role="tab" data-tab="wait" aria-selected="true">
        À distribuer <span class="count" id="count-attente">0</span>
      </button>
      <button type="button" class="tab" role="tab" data-tab="done" aria-selected="false">
        Distribués <span class="count" id="count-done-tab">0</span>
      </button>
    </div>
  </div>

  <div class="list" id="liste"></div>
</main>

<div id="notif" role="status"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyB-YxRRl5hqloBnM1lnXn49v8jIKdg6V58",
    authDomain: "maillots-a8927.firebaseapp.com",
    databaseURL: "https://maillots-a8927-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "maillots-a8927",
    storageBucket: "maillots-a8927.firebasestorage.app",
    messagingSenderId: "112094741681",
    appId: "1:112094741681:web:11259574f2fc7be9394e90"
  };

  const TAILLES = ['12/14A', 'XS', 'S', 'M', 'L', 'XL'];
  const STORAGE_KEY = 'as_tshirts_opuss';

  let eleves = [];
  try { eleves = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; } catch (e) { eleves = []; }

  let onglet = 'wait';
  let dernierValide = null;
  let notifTimer = null;
  let db = null;
  let resetTimer = null;

  const $ = id => document.getElementById(id);

  function esc(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function notification(texte, estErreur = false) {
    const el = $('notif');
    el.className = (estErreur ? 'err' : 'ok') + ' show';
    el.textContent = texte;
    clearTimeout(notifTimer);
    notifTimer = setTimeout(() => el.classList.remove('show'), 4500);
  }

  /* ---------- Initialisation Firestore ---------- */
  function initFirestore() {
    try {
      if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
      }
      db = firebase.firestore();

      db.collection('as_tshirts_haignere').doc('campagne_actuelle').onSnapshot(doc => {
        $('cloud-text').textContent = "En direct";
        $('cloud-dot').className = "cloud-dot online";

        if (doc.exists) {
          const donneesCloud = doc.data().eleves;
          // Sécurité : n'écrase pas si la base cloud est vide alors qu'on a déjà des élèves en local
          if (Array.isArray(donneesCloud) && (donneesCloud.length > 0 || eleves.length === 0)) {
            eleves = donneesCloud;
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(eleves)); } catch (e) {}
            rendre();
          }
        }
      }, err => {
        console.warn("Erreur Firestore :", err);
        $('cloud-text').textContent = "Hors ligne (Local)";
        $('cloud-dot').className = "cloud-dot err";
      });
    } catch(err) {
      console.warn("Erreur init Firebase :", err);
      $('cloud-text').textContent = "Mode Local";
      $('cloud-dot').className = "cloud-dot";
    }
  }

  function sauvegarder() {
    // 1. Sauvegarde locale immédiate (infaillible)
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(eleves)); } catch (e) {}
    rendre();

    // 2. Envoi sur le Cloud Firestore
    if (db) {
      db.collection('as_tshirts_haignere').doc('campagne_actuelle').set({
        eleves: eleves,
        derniereMaj: new Date().toISOString()
      }).catch(err => {
        console.error("Erreur Firestore :", err);
        notification("Erreur Cloud : règles Firestore non autorisées", true);
      });
    }
  }

  /* ---------- Découpage CSV OPUSS ---------- */
  function lireFichierCSV(event) {
    const fichier = event.target.files[0];
    if (!fichier) return;

    notification("Lecture du fichier en cours...");
    const reader = new FileReader();

    reader.onload = function(e) {
      try {
        analyserCSV(e.target.result);
      } catch (err) {
        console.error(err);
        notification("Erreur lors de l'analyse : " + err.message, true);
      }
      event.target.value = '';
    };

    reader.onerror = () => notification("Impossible d'ouvrir le fichier.", true);
    reader.readAsText(fichier, 'UTF-8');
  }

  function decouperLigne(ligne, sep) {
    const out = [];
    let cur = '', guillemets = false;
    for (let i = 0; i < ligne.length; i++) {
      const c = ligne[i];
      if (guillemets) {
        if (c === '"' && ligne[i + 1] === '"') { cur += '"'; i++; }
        else if (c === '"') guillemets = false;
        else cur += c;
      } else if (c === '"') guillemets = true;
      else if (c === sep) { out.push(cur.trim()); cur = ''; }
      else cur += c;
    }
    out.push(cur.trim());
    return out;
  }

  function analyserCSV(texte) {
    // Suppression du BOM UTF-8 éventuel
    if (texte.charCodeAt(0) === 0xFEFF) {
      texte = texte.slice(1);
    }

    const lignes = texte.split(/\r?\n/).filter(l => l.trim().length > 0);
    if (lignes.length < 2) {
      notification("Le fichier CSV est vide ou sans lignes.", true);
      return;
    }

    const premiere = lignes[0];
    const sep = (premiere.split(';').length >= premiere.split(',').length) ? ';' : ',';

    const entetes = decouperLigne(premiere, sep)
      .map(h => (h || '').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""));

    const colLicence = entetes.findIndex(h => h.includes('licence'));
    const colNom = entetes.findIndex(h => h.includes('nom') && !h.includes('prenom') && !h.includes('etablissement'));
    const colPrenom = entetes.findIndex(h => h.includes('prenom'));
    const colClasse = entetes.findIndex(h => h.includes('classe') && !h.includes('niveau'));
    const colNiveau = entetes.findIndex(h => h.includes('niveau'));
    const colCat = entetes.findIndex(h => h.includes('categorie'));

    let ajouts = 0, existants = 0;

    for (let i = 1; i < lignes.length; i++) {
      const cols = decouperLigne(lignes[i], sep);
      if (cols.length < 2) continue;

      const numLicence = (colLicence !== -1 && cols[colLicence]) ? cols[colLicence].trim() : '';
      const nom = ((colNom !== -1 && cols[colNom]) ? cols[colNom] : (cols[1] || '')).trim();
      const prenom = ((colPrenom !== -1 && cols[colPrenom]) ? cols[colPrenom] : (cols[2] || '')).trim();
      const classe = (colClasse !== -1 && cols[colClasse]) ? cols[colClasse].trim() : '';
      const niveau = (colNiveau !== -1 && cols[colNiveau]) ? cols[colNiveau].trim() : '';
      const categorie = (colCat !== -1 && cols[colCat]) ? cols[colCat].trim() : '';

      if (!nom && !prenom) continue;

      const cleUnique = numLicence ? numLicence : `${nom.toUpperCase()}_${prenom.toUpperCase()}`;
      const idx = eleves.findIndex(e => e.cleUnique === cleUnique);

      if (idx === -1) {
        eleves.push({
          cleUnique: String(cleUnique),
          licence: String(numLicence),
          nom: String(nom.toUpperCase()),
          prenom: String(prenom),
          niveau: String(niveau || classe || ''),
          categorie: String(categorie || ''),
          distribue: false,
          taille: '',
          dateDistribution: ''
        });
        ajouts++;
      } else {
        if (niveau || classe) eleves[idx].niveau = String(niveau || classe);
        existants++;
      }
    }

    sauvegarder();
    notification(`✅ ${ajouts} élève(s) ajouté(s), ${existants} déjà présent(s).`);
  }

  /* ---------- Actions ---------- */
  function validerDistribution(cle, taille) {
    const e = eleves.find(x => x.c
